services:
  - type: web
    name: pulsetrack-backend
    runtime: python3.10
    region: ohio
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r server/requirements.txt
    startCommand: python server/manage.py migrate --noinput && gunicorn server.Logistics.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class sync --timeout 60 --log-level info
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.render.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pulsetrack-frontend-henna.vercel.app,https://*.render.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pulsetrack-db
          property: connectionString

  - type: pserv
    name: pulsetrack-db
    runtime: postgres15
    region: ohio
    plan: free
    initialDatabase: railway
    postgresMajorVersion: 15
